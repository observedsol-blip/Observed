[package]
name = "seal_spike"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "seal_spike"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"
solana-sha256-hasher = "3"

[dev-dependencies]
litesvm = "0.16.0"
solana-message = "4"
solana-transaction = { version = "4", features = ["verify"] }
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
