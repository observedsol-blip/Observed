[package]
name = "observed"
version = "0.1.0"
description = "Observed — one question a day, one probability, one approval"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "observed"

[features]
default = []
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
spl-token-group-interface = "=0.7.2"
pyth-solana-receiver-sdk = "2.0.0"
solana-sha256-hasher = "3"

[dev-dependencies]
pyth-solana-receiver-sdk = "2.0.0"
pythnet-sdk = "3"
litesvm = "0.16.0"
solana-message = "4"
solana-transaction = { version = "4", features = ["verify"] }
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "4"
solana-clock = "3"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
spl-token-2022-interface = "=2.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
