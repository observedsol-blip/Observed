name = "observed-resolver"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# One run every hour. The run works out what is due from the chain, so a missed run heals itself.
# Cron triggers with an interval >= 1 h get 15 min CPU on the paid plan (free plan is 10 ms and
# will NOT do: signing plus VAA verification needs far more).
[triggers]
crons = ["0 * * * *"]

[vars]
GAME_ID = "1"

# Secrets (never in this file, never in the repo):
#   wrangler secret put PYTH_API_KEY
#   wrangler secret put HOT_WALLET_KEY          # base58 secret key of the fee payer
#   wrangler secret put RPC_URL
#   wrangler secret put HEALTHCHECK_RUN_URL
#   wrangler secret put HEALTHCHECK_BACKLOG_URL
